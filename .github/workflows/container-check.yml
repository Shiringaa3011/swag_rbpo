name: S08 Container check

# Дополнительная ручная приёмка образа и Compose-стенда.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose
        shell: bash
        run: |
          docker version
          docker compose version
          docker compose config --quiet
          mkdir -p Evidence
          git rev-parse HEAD > Evidence/container-commit.txt

      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check running application
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health | grep -F '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/info | grep -F '"label":"campuspass-compose"'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/events | grep -F 'CampusPass Demo Workshop'
          docker compose exec -T api dotnet CampusPass.Api.dll --healthcheck
          test "$(docker compose exec -T api id -u)" != "0"
          docker compose exec -T api test ! -f /app/.env

      - name: Save container evidence
        if: always()
        shell: bash
        run: |
          mkdir -p Evidence
          docker compose ps --all > Evidence/container-status.txt
          docker compose logs --no-color > Evidence/container-logs.txt
          docker image inspect campuspass:local > Evidence/image-inspect.json || true

      - name: Stop stand
        if: always()
        run: docker compose down --volumes

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s08-container-${{ github.sha }}-${{ github.run_attempt }}
          path: Evidence/
          if-no-files-found: warn
          retention-days: 30
